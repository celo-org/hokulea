[workspace]
resolver = "2"
members = [
    "bin/*",
    "canoe/bindings",
    "canoe/provider",
    "canoe/sp1-cc/client",
    "canoe/sp1-cc/host",
    "canoe/sp1-cc/verifier",
    "canoe/sp1-cc/vkey-bin",
    "canoe/steel/apps",
    "canoe/steel/methods",
    "canoe/steel/verifier",
    "canoe/verifier-address-fetcher",
    "canoe/verifier",
    "crates/*",
    "example/preloader",
]

[profile.dev-client]
inherits = "dev"
panic = "abort"

[profile.release-client-lto]
inherits = "release"
panic = "abort"
codegen-units = 1
lto = "fat"

[workspace.dependencies]
kona-client = { git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-host = { git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-derive = { version = "0.4.5", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-driver = { version = "0.4.0", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-executor = { version = "0.4.0", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-preimage = { version = "0.3.0", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-proof = { version = "0.3.0", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-std-fpvm = { version = "0.2.0", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-std-fpvm-proc = { version = "0.2.0", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-genesis = { version = "0.4.5", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-protocol = { version = "0.4.5", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }
kona-cli = { version = "0.3.2", git = "https://github.com/celo-org/optimism", rev = "23e76f204630099efa0378d6152773c5ea094efd", default-features = false }

# Workspace
hokulea-host-bin = { path = "bin/host", version = "0.1.0", default-features = false }
hokulea-client-bin = { path = "bin/client", version = "0.1.0", default-features = false }
hokulea-client = { path = "crates/client", version = "0.1.0", default-features = false }
hokulea-eigenda = { path = "crates/eigenda", version = "0.1.0", default-features = false }
hokulea-proof = { path = "crates/proof", version = "0.1.0", default-features = false }
hokulea-compute-proof = { path = "crates/compute-proof", version = "0.1.0", default-features = false }
hokulea-witgen = { path = "crates/witgen", version = "0.1.0", default-features = false }
hokulea-zkvm-verification = { path = "crates/zkvm-verification", version = "0.1.0", default-features = false }
hokulea-registry = { path = "crates/registry", version = "0.1.0", default-features = false }

# EigenDA v2 struct
eigenda-cert = { path = "crates/eigenda-cert" }

# Alloy (Network)
alloy-consensus = { version = "=1.6.3", default-features = false }
alloy-genesis = { version = "=1.6.3", default-features = false }
alloy-primitives = { version = "1.5.6", default-features = false }
alloy-provider = { version = "=1.6.3", default-features = false }
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-rpc-client = { version = "=1.6.3", default-features = false }
alloy-rpc-types = { version = "=1.6.3", default-features = false }
alloy-sol-types = { version = "1.5.6", default-features = false }

# Execution
alloy-evm = { version = "0.27.2", default-features = false }
alloy-op-evm = { version = "0.26.3", default-features = false }
op-revm = { version = "15.0.0", default-features = false }
revm = { version = "34.0.0", default-features = false }
revm-primitives = { version = "21.0.2", default-features = false }

# OP Alloy
op-alloy-consensus = { version = "=0.23.1", default-features = false }

# Reth
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3", default-features = false }
reth-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3", default-features = false }

# General
async-trait = "0.1.88"
cfg-if = "1.0.0"
clap = "4.5.39"
num = "0.4"
reqwest = "0.12.19"
rkyv = { version = "0.8", features = ["hashbrown-0_15", "std"] }
spin = "0.10.0"
tokio = "1.45.1"

# General
anyhow = { version = "1.0.98", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
thiserror = { version = "2.0.12", default-features = false }

rust-kzg-bn254-primitives = { version = "0.1.3", git = "https://github.com/Layr-Labs/rust-kzg-bn254.git", default-features = false }
rust-kzg-bn254-verifier = { version = "0.1.3", git = "https://github.com/Layr-Labs/rust-kzg-bn254.git", default-features = false }
rust-kzg-bn254-prover = { version = "0.1.2", git = "https://github.com/Layr-Labs/rust-kzg-bn254.git", default-features = false }

ark-bn254 = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false }

# Tracing
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false }

# Serialization
serde = { version = "1.0.219", default-features = false }
serde_json = { version = "1.0.140", default-features = false }

canoe-bindings = { path = "./canoe/bindings", default-features = false }
canoe-provider = { path = "./canoe/provider", default-features = false }
canoe-verifier = { path = "./canoe/verifier", default-features = false }
canoe-verifier-address-fetcher = { path = "./canoe/verifier-address-fetcher", default-features = false }

# Steel
canoe-steel-apps = { path = "./canoe/steel/apps", default-features = false }
canoe-steel-methods = { path = "./canoe/steel/methods", default-features = false }
canoe-steel-verifier = { path = "./canoe/steel/verifier", default-features = false }

risc0-build = { version = "3.0", features = ["docker"] }
risc0-build-ethereum = { version = "3.0" }
risc0-steel = { git = "https://github.com/boundless-xyz/steel.git", tag = "v2.4.0" }
risc0-zkvm = { version = "3.0.3" }

# Sp1-contract-call
canoe-sp1-cc-client = { path = "./canoe/sp1-cc/client", default-features = false }
canoe-sp1-cc-host = { path = "./canoe/sp1-cc/host", default-features = false }
canoe-sp1-cc-verifier = { path = "./canoe/sp1-cc/verifier", default-features = false }

# RSP and SP1-CC - update to tags once released
rsp-primitives = { git = "https://github.com/succinctlabs/rsp", tag = "reth-1.9.3-sp1-6.1.0" }
sp1-build = "=6.1.0"
sp1-cc-client-executor = { git = "https://github.com/succinctlabs/sp1-contract-call.git", tag = "reth-1.9.3-sp1-6.1.0" }
sp1-cc-host-executor = { git = "https://github.com/succinctlabs/sp1-contract-call.git", tag = "reth-1.9.3-sp1-6.1.0" }
sp1-core-executor = "=6.1.0"
sp1-hypercube = "=6.1.0"
sp1-lib = "=6.1.0"
sp1-primitives = "=6.1.0"
sp1-prover = "=6.1.0"
sp1-sdk = { version = "=6.1.0", features = ["network"] }
sp1-zkvm = "=6.1.0"

# ZKVM deps
bincode = "1.3.3"
hex = "0.4"
url = { version = "2.5.4" }

[patch.crates-io]

# Patch op-alloy and alloy-op-evm to use the optimism monorepo versions
# Required because kona v1.2.14 uses path deps from the monorepo, and hokulea's
# own [patch] section doesn't propagate when used as a git dependency.
